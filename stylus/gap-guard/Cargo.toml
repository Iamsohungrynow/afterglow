[package]
name = "gap-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Afterglow GapGuard: weekend gap-risk model for tokenized stocks (Arbitrum Stylus)"

[dependencies]
stylus-sdk = "=0.9.0"
alloy-primitives = "=0.8.20"
alloy-sol-types = "=0.8.20"
openzeppelin-stylus = "=0.3.0"

[dev-dependencies]
motsu = "=0.10.0"

[features]
export-abi = ["stylus-sdk/export-abi", "openzeppelin-stylus/export-abi"]
debug = ["stylus-sdk/debug"]

[lib]
# cdylib is produced for wasm only (see build.sh); host builds stay rlib so they link on Windows.
crate-type = ["lib"]

[[bin]]
name = "gap-guard"
path = "src/main.rs"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"

# Windows-only build fix, see ../patches/stylus-proc/src/lib.rs (end of file).
[patch.crates-io]
stylus-proc = { path = "../patches/stylus-proc" }
